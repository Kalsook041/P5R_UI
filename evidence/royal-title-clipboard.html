function sample(track, t) {
  if (t <= track[0][0]) return track[0].slice(1);
  for (let i = 1; i < track.length; i++) {
    const a = track[i - 1], b = track[i];
    if (t <= b[0]) {
      const f = (t - a[0]) / (b[0] - a[0]);
      return [a[1] + f * (b[1] - a[1]), a[2] + f * (b[2] - a[2])];
    }
  }
  return track.at(-1).slice(1);
}

function idlePlane(model, name, seconds) {
  const phase = (seconds % model.idle.period) / model.idle.period * Math.PI * 2;
  const coef = model.idle.planes[name];
  return coef[0].map((point, k) => point.map((v, j) => {
    for (let h = 1; h <= model.idle.harmonics; h++) {
      v += coef[h * 2 - 1][k][j] * Math.cos(h * phase)
        + coef[h * 2][k][j] * Math.sin(h * phase);
    }
    return v;
  }));
}

class MenuMotion {
  constructor(model, { initialIndex = 0, speed = 1, reduced = false } = {}) {
    this.model = model;
    this.checkIndex(initialIndex);
    this.setSpeed(speed);
    this.clock = 0;
    this.paused = false;
    this.selected = initialIndex;
    this.reduced = reduced;
    this.transitions = model.centers.map(() => null);
    this.travel = null;
    this.stabilize();
  }

  checkIndex(index) {
    if (!Number.isInteger(index) || index < 0 || index >= this.model.centers.length) {
      throw new RangeError('index must be an integer from 0 to 3');
    }
  }

  setSpeed(speed) {
    if (!Number.isFinite(speed) || speed <= 0) throw new RangeError('speed must be positive');
    this.speed = speed;
  }

  stabilize() {
    const m = this.model;
    this.x = m.centers[this.selected];
    this.poses = m.centers.map((_, i) => ({
      s: i === this.selected ? m.selected : m.baseline,
      a: i === this.selected ? m.angles[i] : 0,
    }));
    this.transitions.fill(null);
    this.travel = null;
  }

  advance(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) throw new RangeError('delta must be nonnegative');
    if (this.paused) return;
    this.clock += seconds * this.speed;
    const m = this.model;
    this.poses = this.poses.map((pose, i) => {
      const tr = this.transitions[i];
      if (!tr) return pose;
      const t = this.clock - tr.started;
      const [s, a] = sample(tr.curve, t);
      if (t >= .2) this.transitions[i] = null;
      if (tr.enter) return { s, a: i % 2 === 0 ? Math.abs(a) : -Math.abs(a) };
      const f = Math.max(0, Math.min(1, (s - m.baseline) / (m.selected - m.baseline)));
      return { s: m.baseline + (tr.from.s - m.baseline) * f, a: tr.from.a * f };
    });
    if (this.travel) {
      const t = this.clock - this.travel.started;
      const f = sample(this.travel.curve, Math.min(t, .2))[0];
      this.x = this.travel.from + (this.travel.to - this.travel.from) * f;
      if (t >= .2) this.travel = null;
    }
  }

  select(index, animate = true) {
    this.checkIndex(index);
    if (index === this.selected) return false;
    const old = this.selected;
    this.selected = index;
    if (this.reduced || this.paused || !animate) this.stabilize();
    else {
      this.transitions[old] = { started: this.clock, enter: false,
        from: { ...this.poses[old] }, curve: this.model.curves.exit[old] };
      this.transitions[index] = { started: this.clock, enter: true,
        curve: this.model.curves.enter[index] };
      this.travel = { started: this.clock, from: this.x,
        to: this.model.centers[index], curve: this.model.curves.travel[index] };
    }
    return true;
  }
}


const defaultAssets = new URL('https://phantom.invalid/');
const defaultModel = null;

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`Cannot load image: ${url}`));
    image.src = url;
  });
}

function tint(image, color) {
  const canvas = document.createElement('canvas');
  canvas.width = image.width;
  canvas.height = image.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0);
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  return canvas;
}

/** Mount an independent menu; see README.md for the controller contract. */
async function createP5RMenu(container, options = {}) {
  if (!(container instanceof HTMLElement)) throw new TypeError('container must be an HTMLElement');
  const response = await fetch(options.modelUrl ?? defaultModel);
  if (!response.ok) throw new Error(`Cannot load model: HTTP ${response.status}`);
  const model = await response.json();
  const preference = matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => options.reducedMotion ?? preference.matches;
  const motion = new MenuMotion(model, {
    initialIndex: options.initialIndex ?? 0, speed: options.speed ?? 1, reduced: reduced(),
  });
  const assets = new URL(options.assetBaseUrl ?? defaultAssets, document.baseURI);
  const images = await Promise.all(model.spriteIds.map(id =>
    loadImage(options.assetUrls[id])));
  const background = options.backgroundUrl
    ? await loadImage(new URL(options.backgroundUrl, document.baseURI)) : null;
  const glyphs = images.slice(0, 4);
  const backs = images.slice(4, 8).map(image => tint(image, '#000'));
  const collars = images.slice(4, 8).map(image => tint(image, model.colors.collar));
  const star = images[8];

  const host = document.createElement('div');
  host.setAttribute('data-p5r-menu', '');
  const shadow = host.attachShadow({ mode: 'open' });
  shadow.innerHTML = `<style>
    :host{display:block;width:100%}.surface{position:relative;aspect-ratio:5/1;overflow:hidden;background:#242428}
    canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
    nav{position:absolute;inset:0}button{position:absolute;top:20%;height:65%;padding:0;transform:translateX(-50%);width:22%;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:1px dashed #bdf7ff;outline-offset:0}
  </style><div class="surface"><canvas aria-hidden="true"></canvas><nav></nav></div>`;
  const canvas = shadow.querySelector('canvas'), ctx = canvas.getContext('2d');
  canvas.width = model.width;
  canvas.height = model.height;
  const nav = shadow.querySelector('nav');
  nav.setAttribute('aria-label', options.ariaLabel ?? 'P5R 标题菜单');
  let destroyed = false, lastTime = performance.now(), raf = 0;
  const buttons = model.labels.map((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('aria-label', label);
    button.style.left = `${(model.centers[index] - model.origin[0]) / model.width * 100}%`;
    button.addEventListener('pointerenter', () => select(index));
    button.addEventListener('focus', () => select(index));
    button.addEventListener('click', () => select(index));
    button.addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? 3
        : (index + (event.key === 'ArrowRight' ? 1 : 3)) % 4;
      buttons[next].focus();
    });
    nav.append(button);
    return button;
  });

  function assertLive() { if (destroyed) throw new Error('P5R menu has been destroyed'); }
  function update(now) { motion.advance(Math.max(0, now - lastTime) / 1000); lastTime = now; }
  function updateButtons() {
    buttons.forEach((button, index) => button.setAttribute('aria-pressed', String(index === motion.selected)));
  }
  function drawImage(image, x, y, scale, angle) {
    ctx.save();
    ctx.translate(x - model.origin[0], y - model.origin[1]);
    ctx.rotate(angle * Math.PI / 180);
    ctx.scale(scale, scale);
    ctx.drawImage(image, -image.width / 2, -image.height / 2);
    ctx.restore();
  }
  function polygon(points, color) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = color;
    ctx.beginPath();
    points.forEach(([x, y], index) => {
      x += motion.x - model.origin[0]; y += model.y - model.origin[1];
      if (index) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    });
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function draw() {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#242428'; ctx.fillRect(0, 0, model.width, model.height);
    if (background) ctx.drawImage(background, 0, 0, model.width, model.height);
    for (const x of model.stars) drawImage(star, x, model.y, model.baseline, 0);
    motion.poses.forEach((pose, i) => drawImage(backs[i], model.centers[i], model.y, pose.s, pose.a));
    const t = motion.reduced ? 0 : motion.clock;
    polygon(idlePlane(model, 'blue', t), model.colors.blue);
    polygon(idlePlane(model, 'cyan', t), model.colors.cyan);
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    motion.poses.forEach((pose, i) => drawImage(collars[i], model.centers[i], model.y, pose.s, pose.a));
    ctx.restore();
    motion.poses.forEach((pose, i) => drawImage(glyphs[i], model.centers[i], model.y, pose.s, pose.a));
  }
  function frame(now) {
    if (destroyed) return;
    update(now);
    if (!motion.paused) draw();
    raf = requestAnimationFrame(frame);
  }
  function select(index, { animate = true, focus = false } = {}) {
    assertLive(); update(performance.now());
    const changed = motion.select(index, animate);
    updateButtons(); draw();
    if (focus) buttons[index].focus();
    if (changed) {
      const detail = { index, label: model.labels[index] };
      container.dispatchEvent(new CustomEvent('p5r-select', { detail }));
      options.onChange?.(detail);
    }
  }
  function onPreferenceChange() {
    update(performance.now()); motion.reduced = reduced();
    if (motion.reduced) motion.stabilize();
    draw();
  }
  preference.addEventListener('change', onPreferenceChange);
  container.append(host);
  updateButtons(); draw(); raf = requestAnimationFrame(frame);
  return {
    select,
    setSpeed(speed) { assertLive(); update(performance.now()); motion.setSpeed(speed); },
    setPaused(paused) {
      assertLive(); update(performance.now()); motion.paused = Boolean(paused); draw();
    },
    getState() {
      return { selectedIndex: motion.selected, label: model.labels[motion.selected],
        speed: motion.speed, paused: motion.paused, reducedMotion: motion.reduced,
        animationTime: motion.clock, destroyed };
    },
    destroy() {
      if (destroyed) return;
      destroyed = true; cancelAnimationFrame(raf);
      preference.removeEventListener('change', onPreferenceChange); host.remove();
    },
  };
}

(async function startOriginal(config,data){
  const stage=document.querySelector('#originalStage'),message=document.querySelector('#originalStatus');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let controller,paused=false,speed=config.speed,clock=0,last=performance.now(),selected=0,previous=0,changed=-5,raf,disposed=false,titleGeneration=0;
  const pending=[];
  function command(d){
    if(!controller){pending.push(d);return;}
    if(d.action==='speed'){speed=d.value;controller?.setSpeed?.(speed);}
    if(d.action==='pause'){paused=Boolean(d.value);controller?.setPaused?.(paused);}
    if(d.action==='replay'){clock=0;changed=-5;selected=0;previous=0;controller?.select?.(0,{animate:false});controller?.destroy?.();if(config.id==='title')mountTitle().catch(fail);updateButtons();}
    if(d.action==='background'){
      const next=d.value==='light',changed=stage.classList.contains('neutral')!==next;stage.classList.toggle('neutral',next);
      if(changed&&config.id==='title'){const index=controller.getState().selectedIndex;controller.destroy();mountTitle(index).catch(fail);}
    }
  }
  addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='phantom-ui')return;if(!controller){pending.push(e.data);return;}command(e.data);});
  function fail(e){message.hidden=false;message.textContent='组件加载失败：'+e.message;console.error(e);}
  const model=structuredClone(data.model);
  if(config.id==='title'){
    model.idle.period=config.period;
    for(const planes of Object.values(model.idle.planes))for(let h=1;h<planes.length;h++)for(const point of planes[h]){point[0]*=config.amplitude;point[1]*=config.amplitude;}
    const gain=(config.scale-1)/(model.selected/model.baseline-1);
    const oldSelected=model.selected;model.selected=model.baseline+(oldSelected-model.baseline)*gain;
    model.angles=model.angles.map(a=>a*config.angle);
    for(const group of ['enter','exit'])for(const track of model.curves[group])for(const p of track){p[1]=model.baseline+(p[1]-model.baseline)*gain;p[2]*=config.angle;}
  }else{
    for(const rows of model.idle)for(let k=1;k<rows.length;k++)rows[k]=rows[k].map(v=>v*config.amplitude);
  }
  async function mountTitle(initialIndex=0){
    const generation=++titleGeneration;controller=null;
    const next=await createP5RMenu(stage,{initialIndex,modelUrl:'data:application/json,'+encodeURIComponent(JSON.stringify(model)),assetUrls:data.images,backgroundUrl:stage.classList.contains('neutral')?null:data.background,speed,onChange:({label})=>{message.textContent=label;}});
    if(disposed||generation!==titleGeneration){next.destroy();return;}
    controller=next;controller.setPaused(paused);message.hidden=true;pending.splice(0).forEach(command);
  }
  function updateButtons(){document.querySelectorAll('[data-choice]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));}
  try{
    if(config.id==='title')await mountTitle();
    else{
      const images={};await Promise.all(Object.entries(data.images).map(async([name,url])=>{const image=new Image();image.src=url;await image.decode();images[name]=image;}));
      const menu=new PauseMenu(model,images);controller={};
      const canvas=stage.querySelector('canvas'),ctx=canvas.getContext('2d');
      function choose(i){if(selected===i)return;previous=selected;selected=i;changed=paused||reduced.matches?clock-5:clock;updateButtons();}
      const nav=document.querySelector('#originalChoices');
      model.labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.dataset.choice=i;b.setAttribute('aria-label',label);b.addEventListener('click',()=>choose(i));nav.append(b);});updateButtons();
      canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=canvas.getBoundingClientRect(),i=menu.hit((e.clientX-r.left)/r.width*1920,(e.clientY-r.top)/r.height*1080);if(i>=0)choose(i);});
      canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),i=menu.hit((e.clientX-r.left)/r.width*1920,(e.clientY-r.top)/r.height*1080);if(i>=0)choose(i);});
      canvas.addEventListener('keydown',e=>{const steps={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1};if(e.key in steps){e.preventDefault();choose((selected+steps[e.key]+10)%10);}if(e.key==='Home'){e.preventDefault();choose(0);}if(e.key==='End'){e.preventDefault();choose(9);}});
      function frame(now){if(disposed)return;const dt=Math.max(0,Math.min(.1,(now-last)/1000));last=now;if(!paused&&!reduced.matches)clock+=dt*speed;
        ctx.fillStyle='#111';ctx.fillRect(0,0,1920,1080);if(!stage.classList.contains('neutral'))ctx.drawImage(images['plate.jpg'],0,0,1920,1080);
        const state=menu.freeState(selected,previous,clock-changed,clock,!reduced.matches);
        state.poses[selected][2]*=config.emphasis;state.poses[selected][3]*=config.emphasis;state.poses[selected][4]*=config.angle;
        ctx.drawImage(menu.render(state),0,0);raf=requestAnimationFrame(frame);
      }
      message.hidden=true;raf=requestAnimationFrame(frame);
    }
    pending.splice(0).forEach(command);
  }catch(e){fail(e);}
  addEventListener('pagehide',()=>{disposed=true;cancelAnimationFrame(raf);controller?.destroy?.();});
})(config,originalAssets);</script></body></html>
